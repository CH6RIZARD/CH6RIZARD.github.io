<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="width:100%;height:100%;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;color:#ECEAE3">
  <div ref="{{ box }}" style="flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden">

    <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
      <div style="{{ holder }}"><div style="{{ inner }}">
        <x-import component-from-global-scope="IOSDevice" from="./ios-frame.js?v=1" dark="{{ true }}" hint-size="402px,874px">
          <div style="position:absolute;inset:0;background:#0b0b0c">
            <sc-if value="{{ pHome }}" hint-placeholder-val="{{ true }}">
              <div aria-hidden="true" style="{{ wall }}"></div>
              <sc-for list="{{ homeItems }}" as="it" hint-placeholder-count="4">
                <button type="button" onClick="{{ it.pick }}" aria-label="{{ it.name }}" style="{{ it.st }}">
                  <sc-if value="{{ it.hasThumb }}" hint-placeholder-val="{{ false }}"><span class="sk" style="display:block;width:104px;height:104px;border-radius:25px"><span style="display:block;width:100%;height:100%;border-radius:25px;background-size:cover;background-position:center;background-image:url({{ it.thumb }})"></span></span></sc-if>
                  <sc-if value="{{ it.noThumb }}" hint-placeholder-val="{{ true }}"><span style="width:104px;height:104px;border-radius:25px;background:#1d1d1b;border:1px solid #3A3936;display:grid;place-items:center;font:500 23px/1 'IBM Plex Mono',monospace;color:#9A9890">{{ it.glyph }}</span></sc-if>
                  <span style="font:400 15px/1.2 Inter,system-ui,sans-serif;text-align:center;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)">{{ it.short }}</span>

              </sc-for>
              <div style="position:absolute;left:16px;right:16px;bottom:26px;height:92px;border-radius:32px;background:rgba(236,234,227,.07);border:1px solid rgba(236,234,227,.09);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;gap:24px">
                <sc-for list="{{ homeItems }}" as="it" hint-placeholder-count="4">
                  <button type="button" onClick="{{ it.pick }}" aria-label="{{ it.dock }}" tabindex="-1" style="padding:0;background:none;border:0;cursor:pointer;display:block">
                    <sc-if value="{{ it.hasThumb }}" hint-placeholder-val="{{ false }}"><span class="sk" style="display:block;width:62px;height:62px;border-radius:15px"><span style="display:block;width:100%;height:100%;border-radius:15px;background-size:cover;background-position:center;background-image:url({{ it.thumb }})"></span></span></sc-if>
                    <sc-if value="{{ it.noThumb }}" hint-placeholder-val="{{ true }}"><span style="width:62px;height:62px;border-radius:15px;background:#1d1d1b;border:1px solid #3A3936;display:grid;place-items:center;font:500 15px/1 'IBM Plex Mono',monospace;color:#9A9890">{{ it.glyph }}</span></sc-if>
                  </button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ pWait }}" hint-placeholder-val="{{ false }}"><div class="sk" style="position:absolute;left:0;right:0;top:54px;bottom:0"></div></sc-if>
            <sc-if value="{{ pLive }}" hint-placeholder-val="{{ false }}"><iframe src="{{ pSrc }}" title="{{ name }}" onLoad="{{ pLoaded }}" allow="fullscreen; autoplay; clipboard-write" style="{{ pFr }}"></iframe></sc-if>
            <sc-if value="{{ pSlot }}" hint-placeholder-val="{{ false }}"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotText }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot></sc-if>
            <sc-if value="{{ pPlate }}" hint-placeholder-val="{{ false }}">

  <div style="{{ barStyle }}">
    <sc-if value="{{ canHome }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ goHome }}" style="height:30px;padding:0 14px;background:none;border:1px solid #3A3936;border-radius:999px;color:#ECEAE3;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap" style-hover="border-color:#8FA0FF;color:#8FA0FF">{{ homeLabel }}</button></sc-if>
    <sc-if value="{{ canInfo }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ goInfo }}" aria-label="{{ infoLabel }}" style="width:30px;height:30px;padding:0;background:none;border:1px solid #3A3936;border-radius:50%;color:#ECEAE3;font:400 14px/1 Fraunces,Georgia,serif;font-style:italic;cursor:pointer" style-hover="border-color:#8FA0FF;color:#8FA0FF">i</button></sc-if>
  </div>
</div>
</x-dc>

    if (!phone) {
      if (!o) screens = [scr({ desk: true, items: pr.items || [] })];
      else if (id === 'stores') screens = [scr({ browser: true, tabs, wait: tabs.some(t => t.wait), url: (STORES.find(t => t[0] === s.tab) || STORES[0])[1] })];
      else if (id === 'notes') screens = [scr({ notes: true, noteList, cur: nCur || notes[0] || {} })];
      else if (WEB[id]) screens = [scr({ web: true, src: WEB[id], title: o.name, webWait: !ok(WEB[id]), fr: fr(WEB[id]), loaded: loaded(WEB[id]) })];
      else if (id === 'frame') gate = true;
      else screens = [scr({ plate: true, title: o.name, status: o.status })];
    }
    const W = s.w || 1, H = s.h || 1, n = screens.length;
    const fits = phone ? [[402, 874]] : n > 1 ? [[3 * 1468 + 160, 1090], [2 * 1468 + 80, 2 * 1090 + 80], [1468, 3 * 1090 + 160]] : [[SW + 28, SH + 80]];
    let LW = fits[0][0], LH = fits[0][1], k = 0;
    for (const [fa, fb] of fits) { const q = Math.min(1, W / fa, H / fb); if (q > k) { k = q; LW = fa; LH = fb; } }
    const open = s.pw && s.se && s.mo;
    return {
      box: this.box, isPhone: phone, isMon: !phone && !gate, isGate: gate, screens, items: pr.items || [],
      fig: { margin: 0, width: SW + 28, flex: '0 0 auto' }, gateScr: { position: 'relative', width: SW, height: SH, borderRadius: 8, overflow: 'hidden', background: '#161615', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 36, padding: tall ? '0 60px' : '0 220px' },
      wall: { position: 'absolute', inset: 0, background: '#0b0b0c ' + this.wall() + ' center / cover no-repeat' },
      homeItems: (pr.items || []).map((it, i) => ({ ...it, dock: it.name + ' (dock)', st: { position: 'absolute', left: (SPOT[i] || SPOT[0])[0], top: (SPOT[i] || SPOT[0])[1], display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, padding: 0, background: 'none', border: 0, cursor: 'pointer', color: '#fff' } })),
      pWait: phone && !!o && !!APP[id] && L && !ok(APP[id]), pLoaded: loaded(APP[id] || ''),
      pFr: { position: 'absolute', left: 0, right: 0, top: 54, bottom: 0, width: '100%', height: 'calc(100% - 54px)', border: 0, background: '#000', opacity: ok(APP[id] || '') ? 1 : 0, transition: 'opacity .3s' },
      holder: { width: LW * k, height: LH * k, position: 'relative', flex: '0 0 auto' },
      inner: { position: 'absolute', left: 0, top: 0, width: LW, height: LH, transform: 'scale(' + k + ')', transformOrigin: '0 0', display: 'flex', flexWrap: 'wrap', justifyContent: 'center', alignContent: 'flex-start', gap: 80 },
      pHome: phone && !o, pLive: phone && !!o && !!APP[id] && L, pSrc: (L && APP[id]) || '', pSlot: phone && !!o && !!APP[id] && !L, pPlate: phone && !!o && !APP[id] && id !== 'notes',
      pNotes: phone && id === 'notes', pList: !nCur, pNote: !!nCur, noteList, cur: nCur || {}, noteBack: () => this.setState({ note: 'list' }),
      slotId: 'shot-' + id, slotText: 'Drop a portrait screenshot of ' + ((o && o.name) || 'the app'), name: (o && o.name) || '', status: (o && o.status) || '',
      barStyle: { flex: '0 0 38px', height: 38, display: !!pr.home || !!pr.info ? 'flex' : 'none', alignItems: 'center', justifyContent: 'center', gap: 10, padding: '4px 0 0' },
      canHome: !!o && !!pr.home, goHome: () => { this.setState({ note: null }); pr.home && pr.home(); }, homeLabel: phone ? '← Home screen' : '← Desktop',
      canInfo: !!pr.info, goInfo: () => pr.info && pr.info(), infoLabel: 'Details for ' + ((o && o.name) || 'this project'),
      gates: [['pw', 'Power'], ['se', 'Sensors'], ['mo', 'Motor']].map(([key, name]) => ({ n: name, on: s[key], state: s[key] ? 'holding' : 'cut', toggle: () => this.setState({ [key]: !s[key] }) })),
      gateLine: s.alive ? 'Gate open. Identity is accruing.' : 'ENDED. This one does not come back.',
      uuid: s.uuid, dt: s.dt.toFixed(1), gen: s.gen, noBirth: s.alive || !open,
      rebirth: () => this.setState({ alive: true, uuid: this.newId(), dt: 0, gen: s.gen + 1 }),
    };
  }
}
</script>
