<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Void Control</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#EFE3C8">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Void Control"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="robots" content="noindex,nofollow">
<style>body{margin:0;background:#0c0d10;color:#e8e8ec;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:#7c8cff;color:#fff;margin-top:12px}.m{color:#8b8f9a;font-size:14px}</style></head><body>
<div><div id="s">Finding your fleet…</div><div class="m" id="m"></div><div id="x"></div></div>
<script>
(async()=>{
 const s=document.getElementById('s'),m=document.getElementById('m'),x=document.getElementById('x');
 let tok=''; try{ if(location.hash.length>1){tok=location.hash.slice(1);localStorage.setItem('vt',tok);history.replaceState(null,'',location.pathname)} tok=localStorage.getItem('vt')||'' }catch{}
 if(!tok){ s.textContent='Open your private link once to sign this device in.'; return }
 try{
  const up=u=>fetch(u+'/manifest.webmanifest',{mode:'no-cors',cache:'no-store'}).then(()=>true).catch(()=>false);
  let j={}; try{ j=await (await fetch('current.json?'+Date.now(),{cache:'no-store'})).json() }catch{}
  let ok=!!j.url&&await up(j.url);
  if(!ok){ // Pages redeploys a few minutes after a tunnel change: read the commit itself (API, then raw) for a newer address
   for(const f of ['https://api.github.com/repos/CH6RIZARD/CH6RIZARD.github.io/contents/vf-5703b66ba4/current.json','https://raw.githubusercontent.com/CH6RIZARD/CH6RIZARD.github.io/main/vf-5703b66ba4/current.json?'+Date.now()]){
    try{ const k=await (await fetch(f,{cache:'no-store',headers:f.includes('api.github')?{Accept:'application/vnd.github.raw'}:{}})).json(); if(k.url&&k.url!==j.url&&await up(k.url)){ j=k; ok=true; break } }catch{}
   }
  }
  if(!j.url) throw 0;
  if(!ok){ s.textContent='Your PC looks offline.'; m.textContent='Last address was set '+(j.at||'?')+'. Retrying automatically every 15 s.'; x.innerHTML='<button onclick="location.reload()">Try again</button>'; setTimeout(()=>location.reload(),15000); return }
  const v=new URLSearchParams(location.search).get('v');location.replace(j.url+'/?t='+encodeURIComponent(tok)+(/^(fleet|fund|job|needs|radar|ezer|mail|vc|today)$/.test(v||'')?'#'+v:''));
 }catch{ s.textContent='Could not reach the fleet.'; x.innerHTML='<button onclick="location.reload()">Try again</button>' }
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
