name: Role radar refresh
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunt
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find roles and build the page
        working-directory: .hunt
        run: |
          python engine.py
          PUBLIC=1 python build_dashboard.py
          mkdir -p ../hunt-q7x2m9
          cp dashboard.html ../hunt-q7x2m9/index.html
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Role radar refresh" && git pull --rebase -q && git push)
